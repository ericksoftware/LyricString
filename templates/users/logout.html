{% extends "base.html" %}
{% load static %}

{% block title %}Logout - LyricString{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-sign-out-alt"></i> Logout</h1>
    <p>Are you sure you want to logout?</p>
</div>

<div class="content-card" style="max-width: 500px; margin: 0 auto; text-align: center;">
    <div style="margin-bottom: 20px;">
        <i class="fas fa-question-circle" style="font-size: 3rem; color: #667eea;"></i>
    </div>
    
    <p style="margin-bottom: 30px; font-size: 1.1rem;">
        You're about to logout from your LyricString account.
    </p>
    
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <div style="display: flex; gap: 15px; justify-content: center;">
            <a href="{% url 'song_list' %}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Logout</button>
        </div>
    </form>
</div>
{% endblock %}
